[project]
name = "spice"
version = "0.2.0"
description = "A local coding agent with CLI and TUI interfaces, multi-provider LLM support, controlled tools, and persistent sessions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["agent", "coding-agent", "llm", "cli", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=0.75.0",
    "google-genai>=1.55.0",
    "mcp>=1.27,<2",
    "openai>=2.14.0",
    "pillow>=11.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.13.4",
    "pyright>=1.1.411",
    "rich>=15.0.0",
    "ruff>=0.15.20",
    "setproctitle>=1.3.7",
    "tavily-python>=0.7.26",
    "textual>=8.2.8",
    "typer>=0.26.7",
]

[project.scripts]
spice = "spice.cli.main:app"

[project.urls]
Homepage = "https://spiceagent.vercel.app/"
Repository = "https://github.com/beelovelife/spice"
Issues = "https://github.com/beelovelife/spice/issues"

[project.optional-dependencies]
browser = [
    "playwright>=1.50",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["spice*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-textual-snapshot>=1.0.0",
]
